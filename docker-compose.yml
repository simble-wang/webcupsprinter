services:
  print-web:
    build: .
    container_name: print-web
    restart: unless-stopped
    network_mode: "host"          # 跟 CUPS 一样用 host 网络，localhost:631 直通
    volumes:
      - ./uploads:/tmp/print_uploads        # 上传文件临时存储
      - /your/nas/path:/nas_files:ro        # ← 改成你的 NAS 文件目录（只读）
      - ./certs:/tmp/certs:ro               # SSL 证书（只读，给 Flask 提供下载）
    environment:
      - TZ=Asia/Shanghai
      - PRINTER_NAME=YourPrinterName     # ← 改成你 CUPS 里的打印机名
      - CUPS_SERVER=localhost:631  # host 模式下直接 localhost 访问 CUPS
      - LOCAL_FILES_DIR=/nas_files # 容器内挂载的 NAS 文件目录
      - SSL_CERT_PATH=/tmp/certs/cert.pem  # 证书路径，供 iPhone 下载安装

  nginx:
    build: ./nginx
    container_name: print-proxy
    restart: unless-stopped
    network_mode: "host"          # host 模式，能直连 localhost:5000 上的 Flask
    environment:
      - TZ=Asia/Shanghai
      # SSL 证书 SAN IP 列表（填你 NAS 的所有可达 IP，浏览器地址栏输入的 IP 必须在这个列表里）
      # 如果以后 IP 变了，改这里 + 删 certs/ 目录下的旧证书 + 重启容器即可重新生成
      - SAN_IPS=IP:127.0.0.1,IP:192.168.1.100    # ← 改成你的 NAS IP
    volumes:
      - ./certs:/etc/nginx/certs            # SSL 证书持久化（容器重建不丢证书）
    depends_on:
      - print-web
