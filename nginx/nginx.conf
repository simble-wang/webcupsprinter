events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;

    # ── Gzip 压缩（传输更快，手机省流量）──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml image/svg+xml application/xml;
    gzip_min_length 256;

    # ── HTTPS 服务器（用 8443 端口，避免与 NAS 管理页面 443 端口冲突）──
    server {
        listen 8443 ssl;
        http2 on;                     # Safari 强烈偏好 HTTP/2，不加这个容易卡住
        server_name _;                # 匹配所有主机名/IP

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # ── Safari 友好的 TLS 配置 ──
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Safari 要求的密码套件放前面，ECDHE+AESGCM 是 iOS 必须支持的
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:AES128-GCM-SHA256:AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off; # 让客户端选密码套件（Safari 更灵活）
        ssl_session_cache   shared:SSL:1m;
        ssl_session_timeout 5m;

        # 上传文件最大 50MB（跟 Flask 一致）
        client_max_body_size 50m;

        # ── 反向代理到 Flask ──
        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;            # 代理用 HTTP 1.1（Flask 不支持 h2）
            proxy_set_header Connection "";

            # 打印任务可能耗时较长，超时设 120 秒
            proxy_read_timeout  120s;
            proxy_send_timeout  120s;
            proxy_connect_timeout 10s;
        }

        # ── 缩略图 API 也走代理（图片响应不需要 gzip）──
        location /api/thumbnail {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            gzip off;
        }
    }
}
